<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍆 茄子管家 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0717;
      color: #e9d5ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: linear-gradient(135deg, #1e1145, #2d1654);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 20px;
      padding: 40px 36px;
      width: 380px;
      max-width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(124, 58, 237, 0.25);
    }
    .logo {
      font-size: 56px;
      margin-bottom: 8px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #8b7aaa;
      margin-bottom: 32px;
    }
    .form-group {
      position: relative;
      margin-bottom: 16px;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 12px;
      background: rgba(15, 7, 23, 0.6);
      color: #e9d5ff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
    }
    .form-group input::placeholder {
      color: #6b5b7b;
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.2s;
      margin-top: 4px;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.4);
    }
    .login-btn:active { transform: scale(0.98); }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      color: #f87171;
      font-size: 13px;
      min-height: 20px;
      margin-top: 12px;
    }
    .hint {
      font-size: 11px;
      color: #6b5b7b;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">🍆</div>
    <div class="title">茄子管家</div>
    <div class="subtitle">个人生活管理 · 登录</div>
    <div class="form-group">
      <input type="password" id="passwordInput" placeholder="请输入访问密码" autocomplete="current-password" autofocus>
    </div>
    <button class="login-btn" id="loginBtn">登 录</button>
    <div class="error-msg" id="errorMsg"></div>
    <div class="hint">Token 有效期 24 小时</div>
  </div>
  <script>
    const input = document.getElementById('passwordInput');
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('errorMsg');

    function doLogin() {
      const pwd = input.value.trim();
      if (!pwd) {
        errEl.textContent = '请输入密码';
        input.focus();
        return;
      }
      errEl.textContent = '';
      btn.disabled = true;
      btn.textContent = '登录中...';

      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          localStorage.setItem('eggplant_token', data.data.token);
          // 跳转到工作台
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
          window.location.href = redirect;
        } else {
          errEl.textContent = data.message || '登录失败';
          btn.disabled = false;
          btn.textContent = '登 录';
          input.select();
        }
      })
      .catch(err => {
        errEl.textContent = '网络错误: ' + err.message;
        btn.disabled = false;
        btn.textContent = '登 录';
      });
    }

    btn.addEventListener('click', doLogin);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    // 如果已有 token，直接跳转
    const existingToken = localStorage.getItem('eggplant_token');
    if (existingToken) {
      // 验证 token 是否有效
      fetch('/api/health', {
        headers: { 'Authorization': 'Bearer ' + existingToken }
      })
      .then(res => {
        if (res.ok) {
          const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
          window.location.href = redirect;
        } else {
          localStorage.removeItem('eggplant_token');
        }
      })
      .catch(() => {});
    }

    input.focus();
  </script>
</body>
</html>
